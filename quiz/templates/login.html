{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #06101f;
            --bg-soft: rgba(8, 18, 38, 0.42);
            --border-soft: rgba(255, 255, 255, 0.12);
            --text-main: #f5f7fb;
            --text-soft: rgba(245, 247, 251, 0.78);
            --accent: #ffbb24;
            --input-bg: rgba(255, 255, 255, 0.10);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            --auth-background: radial-gradient(circle at top left, rgba(255, 187, 36, 0.12), transparent 30%), radial-gradient(circle at bottom right, rgba(82, 135, 255, 0.12), transparent 28%), linear-gradient(135deg, #000814, #001133 55%, #071b36);
            --auth-overlay: rgba(0, 0, 0, 0.18);
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: var(--text-main);
            background: var(--auth-background);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* container geral */
        .container-login {
            width: 100%;
            max-width: 470px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* GIF */
        .gif-topo {
            width: 220px;
            display: block;
            margin: -70px auto 10px auto; /* CENTRALIZA */
        }

        /* caixa */
        .box {
            background: rgba(0, 0, 0, 0.441);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 0 25px #ffbb24;
            width: 460px;
            max-width: 90%;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            margin: 15px 0;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            background: #d9dfeb;
            color: black;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            background: #ffbb24;
            color: black;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: whitesmoke;
            transform: scale(1.02);
        }

        .criar-usuario {
            display: inline-block;
            margin-top: 15px;
            color: whitesmoke;
            text-decoration: none;
            font-weight: bold;
        }

        .criar-usuario:hover {
            text-decoration: underline;
        }

        .erro {
            color: #ff4d4d;
            margin-top: 12px;
            font-weight: bold;
        }
    </style>
    {% if tema_css_inline %}
        <style>{{ tema_css_inline|safe }}</style>
    {% endif %}
</head>
<body>
    <div class="container-login">

        <!-- GIF CENTRALIZADO -->
        <img src="{% static 'css/login-top.gif' %}" class="gif-topo">

        <div class="box">
            <h2>Login</h2>

            <form method="post">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Usuário" required>
                <input type="password" name="password" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>

            <a href="/criar-usuario/" class="criar-usuario">Criar usuário</a>

            {% if erro %}
                <p class="erro">{{ erro }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
